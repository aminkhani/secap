x-django-common: &django-common
  build:
    context: .
    target: development
  env_file: .env.dev
  stdin_open: true
  tty: true
  environment:
    DJANGO_SETTINGS_MODULE: scmserver.settings.dev
    DATABASE_URL: postgres://${POSTGRES_USER:-scmuser}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-scmserver}
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
  volumes:
    - ./src:/app/src
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - backend

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scmserver}
      POSTGRES_USER: ${POSTGRES_USER:-scmuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-scmuser} -d ${POSTGRES_DB:-scmserver}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ── Database migration (one-shot) ──────────────────────────
  migrate:
    <<: *django-common
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py compilemessages || true"
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  # ── Django dev server ────────────────────────────────────────
  web:
    <<: *django-common
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - static_files:/app/src/static
      - media_files:/app/src/media
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend
      - frontend

  # ── Celery Worker ───────────────────────────────────────────
  celery_worker:
    <<: *django-common
    restart: unless-stopped
    command: celery -A scmserver worker --loglevel=info --concurrency=4 --events
    volumes:
      - media_files:/app/src/media
    networks:
      - backend
      - host_access

  # ── Celery Beat ─────────────────────────────────────────────
  celery_beat:
    <<: *django-common
    restart: unless-stopped
    command: >
      celery -A scmserver beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ── Flower (Celery UI) ──────────────────────────────────────
  flower:
    <<: *django-common
    restart: unless-stopped
    command: >
      celery -A scmserver flower
      --port=5555
      --basic_auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD is required}
    ports:
      - "${FLOWER_PORT:-5555}:5555"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend

  # ── Portainer ───────────────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - frontend

  docs:
    build:
      context: ./docs
      target: development
    volumes:
      - ./docs:/app
      - docs_node_modules:/app/node_modules
    ports:
      - "${DOCS_PORT:-8888}:3000"
    networks:
      - frontend

  # ── OpenSCAP Offline Installer Repository ──────────────────
  repo:
    build:
      context: ./repo
    restart: unless-stopped
    ports:
      - "${SCAP_REPO_PORT:-8080}:8080"
    networks:
      - host_access
      - frontend

# ── Named volumes ────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  portainer_data:
  docs_node_modules:

# ── Networks ─────────────────────────────────────────────────
networks:
  backend:
    internal: true
  frontend:
  host_access:
    driver: bridge
