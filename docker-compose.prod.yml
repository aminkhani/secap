x-django-common: &prod-common
  build:
    context: .
    target: production
  env_file: .env.prod
  restart: always
  stdin_open: true
  tty: true
  environment:
    DJANGO_SETTINGS_MODULE: secapserver.settings.prod
    DEBUG: "False"
    DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
    VAULT_ADDR: http://vault:8200
    VAULT_TOKEN: ${VAULT_DEV_ROOT_TOKEN_ID}
    VAULT_KV_MOUNT: secret
  volumes: []
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    vault:
      condition: service_healthy
  networks:
    - backend

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # ── Nginx (reverse proxy + static) ──────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - static_files:/app/src/static:ro
      - media_files:/app/src/media:ro
    depends_on:
      - web
      - flower
      - portainer
      - docs
      - repo
    networks:
      - frontend

  # ── Django dev server ────────────────────────────────────────
  web:
    <<: *prod-common
    environment:
      DJANGO_SETTINGS_MODULE: secapserver.settings.prod
      DEBUG: "False"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?CSRF_TRUSTED_ORIGINS is required}
    volumes:
      - static_files:/app/src/static
      - media_files:/app/src/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend

  # ── Celery Worker ───────────────────────────────────────────
  celery_worker:
    <<: *prod-common
    command: celery -A secapserver worker --loglevel=info --concurrency=8 --events
    volumes:
      - media_files:/app/src/media
    networks:
      - backend
      - host_access

  # ── Celery Beat ─────────────────────────────────────────────
  celery_beat:
    <<: *prod-common
    restart: unless-stopped
    command: >
      celery -A secapserver beat
      --loglevel=info
      --scheduler django_celery_beat.schedulers:DatabaseScheduler

  # ── Flower (Celery UI) ──────────────────────────────────────
  flower:
    <<: *prod-common
    restart: unless-stopped
    command: >
      celery -A secapserver flower
      --port=5555
      --url_prefix=flower
      --basic_auth=${FLOWER_USER}:${FLOWER_PASSWORD:?FLOWER_PASSWORD is required}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend

  # ── Portainer ───────────────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:latest
    restart: unless-stopped
    command:
      - --base-url=/portainer
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - frontend

  docs:
    build:
      context: ./docs
      target: development
      args:
        DOCS_URL: ${DOCS_URL}
    volumes:
      - ./docs:/app
      - docs_node_modules:/app/node_modules
    networks:
      - frontend

  # ── OpenSCAP Offline Installer Repository ──────────────────
  repo:
    build:
      context: ./repo
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - host_access
      - frontend

  vault:
    image: hashicorp/vault:1.17
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:?VAULT_TOKEN is required}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: vault server -dev
    volumes:
      - vault_data:/vault/file
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health"]
      interval: 10s
      timeout: 5s
      retries: 10

# ── Named volumes ────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  static_files:
  media_files:
  portainer_data:
  docs_node_modules:
  vault_data:

# ── Networks ─────────────────────────────────────────────────
networks:
  backend:
    internal: true
  frontend:
  host_access:
    driver: bridge
